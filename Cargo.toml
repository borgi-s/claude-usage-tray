[package]
name = "claude-usage-tray"
version = "0.7.1"
edition = "2021"
authors = ["borgi-s"]
description = "Native Windows tray widget for Claude Code usage tracking."
license = "MIT"
repository = "https://github.com/borgi-s/claude-usage-tray"
readme = "README.md"

[dependencies]
ureq = { version = "2.10", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
bincode = "1.3"
dirs = "5"
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
egui_plot = "0.29"
egui_extras = { version = "0.29", features = ["datepicker"] }
winit = { version = "0.30", features = [] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
arrow = "58.3.0"
parquet = "58.3.0"
dotenvy = "0.15.7"
semver = "1"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
